name: sepa-collect

# 미너비니 수집·스크리닝·텔레그램 알림 — 맥이 자고 있어도 돈다 (토큰 0).
#   us: 화~토 06:00 KST = 월~금 21:00 UTC (미국 전일 종가, 마감 +1h)
#   kr: 월~금 16:40 KST = 월~금 07:40 UTC (한국 당일 종가, 마감 +70분)
# 일봉은 매 실행 2년치를 새로 받는다(캐시 없음, 약 10분). 산출물(out/, 알림 상태)은 저장소에 커밋한다.

# GitHub 크론은 수 시간 늦게 도는 일이 흔하다(실측 09-23·24: kr 07:40→12:53 UTC, us 21:00→23:23 UTC).
# 슬롯을 여러 개 걸고, 이미 그 세션을 받았으면 즉시 종료하는 가드로 중복을 막는다. 정각은 피한다.
on:
  schedule:
    - cron: "7 21 * * 1-5"    # us 1차 (06:07 KST)
    - cron: "7 23 * * 1-5"    # us 2차
    - cron: "43 7 * * 1-5"    # kr 1차 (16:43 KST)
    - cron: "43 8 * * 1-5"    # kr 2차
    - cron: "43 9 * * 1-5"    # kr 3차
    # 2026-10-08 Actions 무료 한도로 7회→5회 (건너뛰는 회차도 1분씩 과금). 공개 저장소 전환으로 과금은 없어졌지만 슬롯은 유지
  workflow_dispatch:
    inputs:
      market:
        description: "us | kr | both"
        default: "both"

permissions:
  contents: write

concurrency:
  group: sepa-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Seoul
      SEPA_WS: ${{ github.workspace }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 시장 결정
        id: mkt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            m="${{ github.event.inputs.market }}"
          else
            # 2026-10-14: 모든 슬롯이 두 시장을 다 본다. 야후는 확정봉을 늦게 올려(미국 21~22시 ET,
            # 한국 다음 날 새벽~오전) 자기 시장 슬롯만으로는 재시도 기회가 없었다 — 10-12~13 KR은
            # kr 슬롯(실제 실행 23~02시 KST)마다 미공개로 떨어지고, 10:41 KST 수동 실행은 56초 만에 성공.
            # 이미 받은 시장은 가드 1이 즉시 건너뛰므로 중복 수집은 없다.
            m="us kr"
          fi
          [ "$m" = "both" ] && m="us kr"
          h=$(date -u +%H)                        # 월 1회 재구축만 슬롯의 '본 시장'에서 한 번 돈다
          if [ "$h" -ge 19 ] || [ "$h" -lt 4 ]; then home="us"; else home="kr"; fi
          echo "markets=$m" >> "$GITHUB_OUTPUT"
          echo "home=$home" >> "$GITHUB_OUTPUT"
          echo "대상: $m (본 시장 $home)"

      - name: 월 1회 유니버스·섹터 재구축 (1일)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date +%d)" = "01" ]; then
            for m in ${{ steps.mkt.outputs.home }}; do
              python scripts/sepa.py universe $m || true
              python scripts/sepa.py sectors $m || true
            done
          fi

      - name: 수집 → 스크리닝 → 알림
        id: collect
        run: |
          set -o pipefail
          gate_failed=""
          for m in ${{ steps.mkt.outputs.markets }}; do
            # 가드 1: 이미 받은 세션이면 종료 (여러 크론 슬롯 중 첫 성공만 일한다)
            target=$(python -c "import sys; sys.path.insert(0,'scripts'); import sepa; print(sepa.last_expected_session('$m'))")
            have=$(python -c "import json; rows=[json.loads(l) for l in open('out/breadth_$m.jsonl') if l.strip()]; print(rows[-1]['as_of'])" 2>/dev/null || echo none)
            echo "=== $m target=$target have=$have"
            if [ "$have" = "$target" ]; then echo "$m: 이미 수집됨 — 스킵"; continue; fi
            echo "=== $m fetch"
            out=$(python scripts/sepa.py fetch $m --threads 6 2>&1 | tail -3); echo "$out"
            # 가드 2: 그 세션 봉이 하나도 없으면 휴장(또는 데이터 미공개) — 실패가 아니라 정상 종료
            if echo "$out" | grep -q "최신=0 "; then echo "$m: $target 봉 없음 — 휴장 또는 미공개, 스킵"; continue; fi
            # 가드 2b(2026-10-14): 응답은 정상인데 target 봉이 없는 종목(미공개)이 5% 넘으면 야후가 아직
            # 확정 중 — screen에 넘기지 않는다. 넘기면 수집 게이트가 '대량 실패(스로틀)'로 오진해 런이 빨개지고
            # (09-30~10-14 거의 매일), 모수가 70%를 겨우 넘는 날엔 반쪽 스냅샷이 '수집됨'으로 굳는다.
            # 정상 날의 미공개는 거래정지 몇 종목뿐(실측 1~9). 다음 슬롯이 재시도한다.
            ok_n=$(echo "$out" | sed -n 's/.*최신=\([0-9]*\).*/\1/p' | tail -1)
            lag_n=$(echo "$out" | sed -n 's/.*미공개=\([0-9]*\).*/\1/p' | tail -1)
            if [ -n "$lag_n" ] && [ "$lag_n" -gt 0 ] && [ $((lag_n * 20)) -gt $((ok_n + lag_n)) ]; then
              # 미공개가 이틀 넘게 이어지면(그 사이 거래일 2개 이상 놓침) 조용히 넘기지 않고 런을 빨갛게 한다
              missed=$(python -c "import datetime as D; a=D.date.fromisoformat('$have') if '$have'!='none' else None; b=D.date.fromisoformat('$target'); print(0 if a is None else sum(1 for i in range(1,(b-a).days) if (a+D.timedelta(i)).weekday()<5))")
              echo "$m: $target 확정봉 미공개 ${lag_n}종목(최신 ${ok_n}) — 산출물 미기록, 다음 슬롯 재시도 (놓친 거래일 $missed)"
              if [ "$missed" -ge 2 ]; then
                echo "::error::$m 야후 미공개가 $missed 거래일째 — have=$have target=$target"
                gate_failed="$gate_failed $m"
              fi
              continue
            fi
            echo "=== $m screen"
            # 가드 3(수집 게이트, 2026-09-30): fetch가 대량 실패해 모수가 급감하면 screen이 산출물을 쓰기 전에
            # 종료코드 3으로 멈춘다. 이 시장의 알림·모멘텀·커밋을 건너뛰고, have가 그대로라 다음 크론 슬롯이 재시도한다.
            set +e
            python scripts/sepa.py screen $m > "screen_$m.log" 2>&1
            rc=$?
            set -e
            head -4 "screen_$m.log"
            if [ "$rc" -eq 3 ]; then
              echo "::error::$m 수집 게이트 발동 — 모수 급감, 산출물 미기록(다음 슬롯이 재시도)"
              gate_failed="$gate_failed $m"
              continue
            fi
            [ "$rc" -eq 0 ] || exit "$rc"
            echo "=== $m notify"
            python alerts/sepa_notify.py $m || echo "notify 실패(무시)"
            # 맥은 일봉 캐시가 없으므로 모멘텀 랭킹 결과를 파일로 남긴다 (아침 브리핑이 이 파일을 읽는다)
            python scripts/sepa.py momentum $m --json > out/momentum_$m.json || true
            python scripts/sepa.py groupgate $m --holdings > out/groupgate_$m.md || true
          done
          echo "gate_failed=${gate_failed# }" >> "$GITHUB_OUTPUT"

      - name: 한국 투자자별 수급 적재 (루틴 보드용)
        if: contains(steps.mkt.outputs.markets, 'kr')
        run: |
          # 네이버는 '오늘' 값만 준다 — 장중(09~15시 KST)에 적재하면 미완성 값이 그날 행으로 남는다
          hk=$(date +%H)   # TZ=Asia/Seoul
          if [ "$hk" -ge 9 ] && [ "$hk" -lt 16 ]; then echo "장중 — 수급 적재 생략"; exit 0; fi
          SEPA_WS="$GITHUB_WORKSPACE" python3 scripts/kr_flows.py || true

      - name: 산출물 커밋
        run: |
          git config user.name "sepa-bot"
          git config user.email "sepa-bot@users.noreply.github.com"
          # 30일 넘은 스크리닝 스냅샷 정리 (브레드스 이력은 jsonl에 영구 보존)
          find out -name "screen_*_*.csv" -mtime +30 -delete || true
          find out -name "screen_*_*.json" -mtime +30 -delete || true
          git add -A out alerts/sepa_notify.state.json universe || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "collect ${{ steps.mkt.outputs.markets }} $(date +%Y-%m-%d\ %H:%M)"
          git pull --rebase -X ours origin main || true
          git push

      # 수집 게이트가 발동한 시장이 있으면 런을 빨갛게 표시한다 — GitHub가 실패 메일을 보내므로 별도 알림 코드가 필요 없다.
      # 정상 시장의 산출물은 위 커밋 스텝에서 이미 저장됐고, 게이트 시장은 have가 그대로라 다음 크론 슬롯이 재시도한다.
      - name: 수집 게이트 발동 시 런을 실패로 표시
        if: ${{ steps.collect.outputs.gate_failed != '' }}
        env:
          GATE_FAILED: ${{ steps.collect.outputs.gate_failed }}
        run: |
          echo "::error::수집 게이트 발동(${GATE_FAILED}) — 모수 급감 또는 야후 미공개 2거래일 이상. 산출물은 기록되지 않았고 다음 크론 슬롯이 재시도한다."
          exit 1
