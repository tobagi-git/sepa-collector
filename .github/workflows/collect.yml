name: sepa-collect

# 미너비니 수집·스크리닝·텔레그램 알림 — 맥이 자고 있어도 돈다 (토큰 0).
#   us: 화~토 06:00 KST = 월~금 21:00 UTC (미국 전일 종가, 마감 +1h)
#   kr: 월~금 16:40 KST = 월~금 07:40 UTC (한국 당일 종가, 마감 +70분)
# 일봉은 매 실행 2년치를 새로 받는다(캐시 없음, 약 10분). 산출물(out/, 알림 상태)은 저장소에 커밋한다.

# GitHub 크론은 수 시간 늦게 도는 일이 흔하다(실측 09-23·24: kr 07:40→12:53 UTC, us 21:00→23:23 UTC).
# 슬롯을 여러 개 걸고, 이미 그 세션을 받았으면 즉시 종료하는 가드로 중복을 막는다. 정각은 피한다.
on:
  schedule:
    - cron: "7 21 * * 1-5"    # us 1차 (06:07 KST)
    - cron: "7 22 * * 1-5"    # us 2차
    - cron: "7 23 * * 1-5"    # us 3차
    - cron: "43 7 * * 1-5"    # kr 1차 (16:43 KST)
    - cron: "13 8 * * 1-5"    # kr 2차
    - cron: "43 8 * * 1-5"    # kr 3차
    - cron: "43 9 * * 1-5"    # kr 4차
  workflow_dispatch:
    inputs:
      market:
        description: "us | kr | both"
        default: "both"

permissions:
  contents: write

concurrency:
  group: sepa-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Seoul
      SEPA_WS: ${{ github.workspace }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 시장 결정
        id: mkt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            m="${{ github.event.inputs.market }}"
          else
            h=$(date -u +%H)                      # UTC 시각으로 시장 판별 (크론 문자열 비교보다 지연에 강함)
            if [ "$h" -ge 19 ] || [ "$h" -lt 4 ]; then m="us"; else m="kr"; fi
          fi
          [ "$m" = "both" ] && m="us kr"
          echo "markets=$m" >> "$GITHUB_OUTPUT"
          echo "대상: $m"

      - name: 월 1회 유니버스·섹터 재구축 (1일)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date +%d)" = "01" ]; then
            for m in ${{ steps.mkt.outputs.markets }}; do
              python scripts/sepa.py universe $m || true
              python scripts/sepa.py sectors $m || true
            done
          fi

      - name: 수집 → 스크리닝 → 알림
        run: |
          set -o pipefail
          for m in ${{ steps.mkt.outputs.markets }}; do
            # 가드 1: 이미 받은 세션이면 종료 (여러 크론 슬롯 중 첫 성공만 일한다)
            target=$(python -c "import sys; sys.path.insert(0,'scripts'); import sepa; print(sepa.last_expected_session('$m'))")
            have=$(python -c "import json; rows=[json.loads(l) for l in open('out/breadth_$m.jsonl') if l.strip()]; print(rows[-1]['as_of'])" 2>/dev/null || echo none)
            echo "=== $m target=$target have=$have"
            if [ "$have" = "$target" ]; then echo "$m: 이미 수집됨 — 스킵"; continue; fi
            echo "=== $m fetch"
            out=$(python scripts/sepa.py fetch $m --threads 6 2>&1 | tail -3); echo "$out"
            # 가드 2: 그 세션 봉이 하나도 없으면 휴장(또는 데이터 미공개) — 실패가 아니라 정상 종료
            if echo "$out" | grep -q "최신=0 "; then echo "$m: $target 봉 없음 — 휴장 또는 미공개, 스킵"; continue; fi
            echo "=== $m screen"
            python scripts/sepa.py screen $m 2>&1 | head -4
            echo "=== $m notify"
            python alerts/sepa_notify.py $m || echo "notify 실패(무시)"
            # 맥은 일봉 캐시가 없으므로 모멘텀 랭킹 결과를 파일로 남긴다 (아침 브리핑이 이 파일을 읽는다)
            python scripts/sepa.py momentum $m --json > out/momentum_$m.json || true
            python scripts/sepa.py groupgate $m --holdings > out/groupgate_$m.md || true
          done

      - name: 산출물 커밋
        run: |
          git config user.name "sepa-bot"
          git config user.email "sepa-bot@users.noreply.github.com"
          # 30일 넘은 스크리닝 스냅샷 정리 (브레드스 이력은 jsonl에 영구 보존)
          find out -name "screen_*_*.csv" -mtime +30 -delete || true
          find out -name "screen_*_*.json" -mtime +30 -delete || true
          git add -A out alerts/sepa_notify.state.json universe || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "collect ${{ steps.mkt.outputs.markets }} $(date +%Y-%m-%d\ %H:%M)"
          git pull --rebase -X ours origin main || true
          git push
